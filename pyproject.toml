[project]
name = "yumbox"
dynamic = ["version"]
description = "A reusable machine learning toolbox for fast prototyping, experiment tracking, and vector search."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Shayan", email = "shayaneshteharipour@gmail.com" }]
dependencies = ["numpy", "pandas"]
keywords = [
    "machine-learning",
    "ml-tools",
    "prototyping",
    "caching",
    "faiss",
    "mlflow",
    "entity-resolution",
    "experiment-tracking",
    "dependency-analysis",
]
classifiers = [
    # Development status
    "Development Status :: 4 - Beta",

    # Python version support
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",

    # License
    "License :: OSI Approved :: MIT License",

    # Platform support
    "Operating System :: OS Independent",

    # Intended audience
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",

    # Topic categorization
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",

    # Development tools
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/eshteharipour/yumbox"
Documentation = "https://yumbox.readthedocs.io/"
Repository = "https://github.com/eshteharipour/yumbox"
Issues = "https://github.com/eshteharipour/yumbox/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "flake8>=4.0", "black>=23.0", "mypy>=0.990"]
extra = ["torch"] # dynamic import in yumbox __init__
faiss = ["faiss-cpu<1.14"]
faiss-gpu = ["faiss-gpu>=1.7"]
cache = [
    # "faiss-cpu<1.14", # dynamic import
    # "h5py",           # module import in hdf
    "lmdb",
    "msgpack",
    "numpy",
    # "pillow",         # dynamic import in fs
    # "redis>=4.0.0",   # module import in redis
    "safetensors",
]
cache-full = [
    "faiss-cpu<1.14",
    "h5py",
    "lmdb",
    "msgpack",
    "numpy",
    "pillow",
    "redis>=4.0.0",
    "safetensors",
]
# config = []
data = [
    "albumentations",
    "arabic-reshaper",
    "matplotlib",
    "numpy",
    "pandas",
    "pillow",          # dynamic import 
    "python-bidi",
    "requests",
    "torch",
    "torchvision",
]
factory = ["faiss-cpu<1.14", "numpy", "scikit-learn"]
metrics = [
    "matplotlib",
    "mlflow>=3",
    "numpy",
    "plotly",
    "scikit-learn",
    "torch",
]
mlflow = ["matplotlib", "mlflow>=3", "numpy", "omegaconf", "pandas", "plotly"]
nlp = ["hazm>=0.9.3", "nltk>=3.8", "pandas", "unicodeblock"]
# parse = [
#     "tomli"  # 3rd party fallback for stdlib `tomllib` in Python < 3.11
# ]
scraper = [
    "colorlog",
    "lxml",
    "parsel",
    "pillow",   # dynamic import 
    "pycurl",
    "scrapy",
    "six",
]
scripts = ["pandas", "tabulate"]
vectors = ["numpy", "pandas", "torch"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["yumbox"]

[project.scripts]
metrics-cli = "yumbox.scripts.cli:main"

[tool.hatch.envs.default.scripts]
test = "pytest -sv"
analyze = "python scripts/cli.py analyze {args}"
generate-docs = "python scripts/generate_docs.py"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "yumbox/_version.py"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
